[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karen-agent"
version = "0.1.0"
description = "Agent loop on top of karen-ai — a Python port of @earendil-works/pi's packages/agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "karen-ai",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/karen_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
