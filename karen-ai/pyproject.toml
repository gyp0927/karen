[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karen-ai"
version = "0.1.0"
description = "Unified LLM API with provider configuration and streaming — a Python port inspired by @earendil-works/pi-ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/karen_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
